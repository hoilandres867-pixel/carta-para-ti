<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Un pequeño detalle para ti</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      background: #f4eadf;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: #5d493b;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,.7), transparent 35%),
        linear-gradient(135deg, #f8f1e8, #eee0cf);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }

    .card {
      width: 100%;
      max-width: 820px;
      padding: 34px;
      text-align: center;
      background: rgba(255, 252, 248, .97);
      border: 1px solid rgba(120, 88, 66, .13);
      border-radius: 28px;
      box-shadow: 0 20px 45px rgba(74, 54, 39, .14);
    }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(2.2rem, 7vw, 3.3rem);
      font-weight: 500;
    }

    p {
      font-size: clamp(1.15rem, 4vw, 1.4rem);
      line-height: 1.7;
    }

    button {
      margin-top: 22px;
      padding: 15px 32px;
      border: 1.5px solid #9c7b62;
      border-radius: 999px;
      background: #fffaf4;
      color: #5d493b;
      font: inherit;
      font-size: 1.08rem;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(84, 61, 44, .12);
      transition: transform .22s ease, box-shadow .22s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(84, 61, 44, .17);
    }

    .fade-out {
      animation: fadeOut .65s forwards;
    }

    #loader,
    #letter {
      display: none;
    }

    #loader {
      text-align: center;
    }

    .paws {
      font-size: 2rem;
      letter-spacing: 8px;
      animation: walk 1.5s ease-in-out infinite;
    }

    .cat {
      margin-top: 14px;
      font-size: 3rem;
      animation: bob .55s ease-in-out infinite alternate;
    }

    #letter {
      opacity: 0;
      transform: scale(.965) translateY(8px);
      transition: opacity .85s ease, transform .85s ease;
    }

    #letter.show {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .letter-card {
      padding: 18px;
    }

    .letter-image {
      display: block;
      width: 100%;
      max-width: none;
      height: auto;
      margin: 0 auto;
      border-radius: 20px;
      box-shadow: 0 16px 34px rgba(70, 50, 35, .18);
    }

    .end {
      margin: 24px 0 4px;
      font-size: clamp(1.35rem, 5vw, 1.8rem);
      font-weight: 700;
      line-height: 1.4;
    }

    .final-cat {
      margin-top: 8px;
      font-size: 2rem;
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        transform: scale(.985);
      }
    }

    @keyframes walk {
      0%, 100% { transform: translateX(-24px); }
      50% { transform: translateX(24px); }
    }

    @keyframes bob {
      from { transform: translateY(0); }
      to { transform: translateY(-7px); }
    }

    @media (max-width: 600px) {
      body {
        align-items: flex-start;
        padding: 8px;
      }

      .card {
        border-radius: 20px;
        padding: 24px 14px;
      }

      .letter-card {
        padding: 10px;
      }

      .letter-image {
        border-radius: 14px;
      }

      .end {
        margin-top: 20px;
        font-size: 1.45rem;
      }
    }
  </style>
</head>

<body>

  <section class="card" id="welcome">
    <h1>Hola... 😊</h1>

    <p>Por si acaso necesitabas una pequeña pausa...</p>

    <p><strong>Aquí está. 🐈</strong></p>

    <button id="open" type="button">🐾 Abrir carta</button>
  </section>

  <section class="card" id="loader" aria-live="polite">
    <div class="paws">🐾 🐾 🐾 🐾</div>
    <div class="cat">🐈</div>
    <p>Un pequeño momento para ti...</p>
  </section>

  <section class="card letter-card" id="letter">
    <img
      src="carta.png"
      alt="Carta especial para ti"
      class="letter-image"
    >

    <div class="end">
      Espero haber conseguido una. 😊
    </div>

    <div class="final-cat">🐈</div>
  </section>

  <script>
    const welcome = document.getElementById("welcome");
    const loader = document.getElementById("loader");
    const letter = document.getElementById("letter");
    const openButton = document.getElementById("open");

    openButton.addEventListener("click", () => {
      openButton.disabled = true;
      welcome.classList.add("fade-out");

      setTimeout(() => {
        welcome.style.display = "none";
        loader.style.display = "block";

        setTimeout(() => {
          loader.style.display = "none";
          letter.style.display = "block";

          requestAnimationFrame(() => {
            letter.classList.add("show");
          });

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });
        }, 1800);
      }, 650);
    });
  </script>

</body>
</html>
