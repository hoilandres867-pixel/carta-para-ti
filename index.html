
<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Un pequeño detalle para ti</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:12px;background:linear-gradient(135deg,#f8f1e8,#eee0cf);font-family:Georgia,serif;color:#5d493b}
.card{width:min(820px,100%);background:#fffcf8;border-radius:24px;padding:26px;box-shadow:0 18px 40px rgba(0,0,0,.12);text-align:center}
#loader,#letter{display:none}
button{padding:15px 30px;border-radius:999px;border:1px solid #9c7b62;background:#fffaf4;font-size:1.05rem;cursor:pointer}
img{width:100%;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,.18)}
#letter{opacity:0;transform:translateY(15px) scale(.98);transition:.8s}
#letter.show{opacity:1;transform:none}
.end{margin-top:20px;font-size:1.45rem;font-weight:bold}
.small{position:fixed;right:14px;bottom:14px;border:none;border-radius:50%;width:46px;height:46px}
@media(max-width:600px){.card{padding:16px}body{padding:8px}}
</style></head><body>
<section class="card" id="welcome">
<h1>Hola... 😊</h1>
<p>Por si acaso necesitabas una pequeña pausa...</p>
<p><b>Aquí está. 🐈</b></p>
<button id="open">🐾 Abrir carta</button>
</section>
<section class="card" id="loader">
<div style="font-size:2rem">🐾 🐾 🐾 🐾</div>
<div style="font-size:3rem">🐈</div>
<p>Un pequeño momento para ti...</p>
</section>
<section class="card" id="letter">
<img src="carta.png" alt="Carta">
<div class="end">Espero haber conseguido una. 😊</div>
</section>
<button id="musicBtn" class="small" style="display:none">🔊</button>
<audio id="bgm" src="videoplayback.m4a"></audio>
<script>
const a=document.getElementById('bgm');
const b=document.getElementById('open');
const w=document.getElementById('welcome');
const l=document.getElementById('loader');
const c=document.getElementById('letter');
const m=document.getElementById('musicBtn');
b.onclick=()=>{
 if(navigator.vibrate){navigator.vibrate(20);}
 a.volume=0;a.play().catch(()=>{});
 let v=0;const f=setInterval(()=>{v+=0.05;a.volume=Math.min(v,.35);if(v>=.35)clearInterval(f);},250);
 w.style.display='none';l.style.display='block';
 setTimeout(()=>{
   l.style.display='none';
   c.style.display='block';
   requestAnimationFrame(()=>c.classList.add('show'));
   m.style.display='block';
 },1200);
};
m.onclick=()=>{
 if(a.paused){a.play();m.textContent='🔊';}
 else{a.pause();m.textContent='🔈';}
}
</script>
</body></html>
