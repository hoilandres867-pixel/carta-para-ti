<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Un pequeño detalle para ti 🐈</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: #4d4039;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,.85), transparent 35%),
        linear-gradient(145deg, #f8eee3, #ead8c5);
      overflow-x: hidden;
    }

    button {
      font: inherit;
    }

    /* Huellitas decorativas */

    .huella {
      position: fixed;
      opacity: .12;
      font-size: 38px;
      user-select: none;
      pointer-events: none;
      animation: flotar 5s ease-in-out infinite;
    }

    .huella-1 {
      top: 8%;
      left: 7%;
      transform: rotate(-20deg);
    }

    .huella-2 {
      top: 23%;
      right: 7%;
      transform: rotate(18deg);
      animation-delay: 1s;
    }

    .huella-3 {
      bottom: 15%;
      left: 8%;
      transform: rotate(15deg);
      animation-delay: 2s;
    }

    .huella-4 {
      bottom: 8%;
      right: 8%;
      transform: rotate(-15deg);
      animation-delay: 3s;
    }

    @keyframes flotar {
      0%, 100% {
        translate: 0 0;
      }

      50% {
        translate: 0 -8px;
      }
    }

    /* Pantalla inicial */

    .inicio {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      transition: opacity .8s ease, transform .8s ease;
    }

    .inicio.oculto {
      opacity: 0;
      transform: scale(.97);
      pointer-events: none;
      position: absolute;
      inset: 0;
    }

    .tarjeta-inicio {
      width: min(92vw, 520px);
      padding: 42px 30px;
      text-align: center;
      background: rgba(255, 252, 247, .94);
      border: 1px solid rgba(150, 108, 79, .16);
      border-radius: 30px;
      box-shadow:
        0 25px 70px rgba(82, 52, 35, .18),
        inset 0 1px 0 rgba(255,255,255,.9);
      backdrop-filter: blur(10px);
      animation: aparecer 1.1s ease;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .gatito {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 105px;
      height: 105px;
      margin-bottom: 18px;
      font-size: 65px;
      background: #f4dfcc;
      border-radius: 50%;
      box-shadow: 0 10px 25px rgba(91, 61, 43, .12);
    }

    .tarjeta-inicio h1 {
      margin: 0 0 20px;
      font-size: clamp(30px, 7vw, 45px);
      font-weight: normal;
      color: #5a463b;
    }

    .tarjeta-inicio p {
      margin: 10px 0;
      font-size: clamp(17px, 4vw, 21px);
      line-height: 1.65;
    }

    .detalle {
      margin-top: 22px !important;
      font-style: italic;
      color: #816b60;
    }

    .boton-abrir {
      margin-top: 30px;
      padding: 16px 30px;
      min-width: 210px;
      border: none;
      border-radius: 999px;
      background: #7d5d4b;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(78, 51, 38, .22);
      transition:
        transform .25s ease,
        box-shadow .25s ease,
        background .25s ease;
    }

    .boton-abrir:hover {
      transform: translateY(-3px);
      background: #6c4d3d;
      box-shadow: 0 16px 30px rgba(78, 51, 38, .28);
    }

    .boton-abrir:active {
      transform: scale(.97);
    }

    /* Carta */

    .seccion-carta {
      display: none;
      min-height: 100vh;
      padding: 35px 14px 60px;
      opacity: 0;
    }

    .seccion-carta.visible {
      display: block;
      animation: revelarCarta 1.2s forwards;
    }

    @keyframes revelarCarta {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .encabezado-carta {
      max-width: 800px;
      margin: 0 auto 20px;
      text-align: center;
    }

    .encabezado-carta h2 {
      margin-bottom: 8px;
      font-size: clamp(25px, 6vw, 38px);
      font-weight: normal;
    }

    .encabezado-carta p {
      margin-top: 0;
      font-size: 17px;
      color: #7c685d;
    }

    .contenedor-imagen {
      width: min(96vw, 850px);
      margin: auto;
      padding: 10px;
      background: rgba(255,255,255,.35);
      border-radius: 25px;
      box-shadow: 0 25px 70px rgba(73, 48, 34, .22);
    }

    .carta-imagen {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 18px;
      animation: zoomSuave 14s ease-in-out infinite alternate;
      transform-origin: center;
    }

    @keyframes zoomSuave {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.015);
      }
    }

    .mensaje-final {
      max-width: 650px;
      margin: 35px auto 0;
      padding: 25px;
      text-align: center;
      font-size: clamp(18px, 4vw, 23px);
      line-height: 1.6;
      background: rgba(255, 251, 245, .8);
      border-radius: 22px;
      box-shadow: 0 15px 35px rgba(79, 52, 38, .12);
    }

    .mensaje-final span {
      display: block;
      margin-top: 12px;
      font-size: 36px;
    }

    .boton-volver {
      display: block;
      margin: 25px auto 0;
      padding: 11px 20px;
      border: 1px solid rgba(103, 73, 57, .35);
      border-radius: 999px;
      background: rgba(255,255,255,.5);
      color: #624c40;
      cursor: pointer;
    }

    .boton-volver:hover {
      background: rgba(255,255,255,.85);
    }

    @media (max-width: 600px) {
      .tarjeta-inicio {
        padding: 35px 22px;
        border-radius: 24px;
      }

      .seccion-carta {
        padding-top: 25px;
      }

      .contenedor-imagen {
        padding: 6px;
        border-radius: 18px;
      }

      .carta-imagen {
        border-radius: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <div class="huella huella-1">🐾</div>
  <div class="huella huella-2">🐾</div>
  <div class="huella huella-3">🐾</div>
  <div class="huella huella-4">🐾</div>

  <main id="inicio" class="inicio">
    <section class="tarjeta-inicio">

      <div class="gatito">🐈</div>

      <h1>Hola… 😊</h1>

      <p>Antes de continuar, tengo un pequeño detalle para ti.</p>

      <p>
        No va a solucionar todo, pero espero que consiga acompañarte
        durante unos minutos.
      </p>

      <p class="detalle">
        Ábrelo cuando tengas un momento tranquilo.
      </p>

      <button id="abrirCarta" class="boton-abrir" type="button">
        🐾 Abrir carta
      </button>

    </section>
  </main>

  <section id="seccionCarta" class="seccion-carta">

    <header class="encabezado-carta">
      <h2>Esto es para ti 🐈</h2>
      <p>Tómate tu tiempo para leerlo.</p>
    </header>

    <div class="contenedor-imagen">
      <img
        class="carta-imagen"
        src="carta.png"
        alt="Carta ilustrada con un mensaje especial y dibujos de gatitos"
      >
    </div>

    <div class="mensaje-final">
      Gracias por regalarme una sonrisa.
      <span>🐈🤍</span>
    </div>

    <button id="volverInicio" class="boton-volver" type="button">
      Volver al inicio
    </button>

  </section>

  <script>
    const inicio = document.getElementById("inicio");
    const seccionCarta = document.getElementById("seccionCarta");
    const botonAbrir = document.getElementById("abrirCarta");
    const botonVolver = document.getElementById("volverInicio");

    botonAbrir.addEventListener("click", () => {
      inicio.classList.add("oculto");

      setTimeout(() => {
        seccionCarta.classList.add("visible");
        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      }, 650);
    });

    botonVolver.addEventListener("click", () => {
      seccionCarta.classList.remove("visible");
      inicio.classList.remove("oculto");

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });
  </script>

</body>
</html>
