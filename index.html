<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Un pequeño detalle para ti</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.7), transparent 35%),
        linear-gradient(135deg, #f7efe4, #eee0cf);
      color: #5f4b3d;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .contenedor {
      width: 100%;
      max-width: 760px;
      text-align: center;
    }

    .tarjeta {
      background: rgba(255, 252, 247, 0.95);
      border: 1px solid rgba(123, 94, 72, 0.18);
      border-radius: 28px;
      box-shadow: 0 18px 45px rgba(95, 75, 61, 0.16);
      padding: 54px 30px;
      position: relative;
      overflow: hidden;
    }

    .huella {
      position: absolute;
      font-size: 28px;
      opacity: 0.12;
      transform: rotate(-18deg);
    }

    .huella-1 {
      top: 24px;
      left: 28px;
    }

    .huella-2 {
      right: 30px;
      bottom: 28px;
      transform: rotate(22deg);
    }

    h1 {
      margin: 0 0 34px;
      font-size: clamp(2rem, 6vw, 3.3rem);
      font-weight: 500;
      color: #6b5140;
    }

    .mensaje {
      margin: 0 auto 32px;
      max-width: 520px;
      font-size: clamp(1.15rem, 3.5vw, 1.55rem);
      line-height: 1.8;
    }

    .aqui-esta {
      margin: 0 0 34px;
      font-size: clamp(1.35rem, 4vw, 1.9rem);
      font-weight: 600;
    }

    .boton {
      appearance: none;
      border: 1.5px solid #9a755c;
      background: #fffaf4;
      color: #6b5140;
      border-radius: 999px;
      padding: 15px 30px;
      font-size: 1.08rem;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(106, 78, 58, 0.12);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    .boton:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(106, 78, 58, 0.17);
      background: #fffdf9;
    }

    .boton:active {
      transform: translateY(0);
    }

    #pantallaInicial {
      opacity: 1;
      transition: opacity 0.65s ease;
    }

    #pantallaInicial.oculta {
      opacity: 0;
      pointer-events: none;
    }

    #carta {
      display: none;
      opacity: 0;
      transform: translateY(12px);
      transition:
        opacity 0.85s ease,
        transform 0.85s ease;
    }

    #carta.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .imagen-carta {
      display: block;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      border-radius: 20px;
      box-shadow: 0 18px 42px rgba(79, 59, 45, 0.2);
    }

    .cierre {
      margin: 36px 0 6px;
      font-size: clamp(1.2rem, 3.5vw, 1.55rem);
      font-weight: 600;
      line-height: 1.6;
      color: #6b5140;
    }

    .gatito-final {
      margin-top: 10px;
      font-size: 2rem;
    }

    @media (max-width: 600px) {
      body {
        padding: 14px;
      }

      .tarjeta {
        padding: 44px 20px;
        border-radius: 22px;
      }

      .mensaje {
        line-height: 1.7;
      }

      .boton {
        width: 100%;
        max-width: 280px;
      }
    }
  </style>
</head>

<body>
  <main class="contenedor">

    <section class="tarjeta" id="pantallaInicial">
      <span class="huella huella-1">🐾</span>
      <span class="huella huella-2">🐾</span>

      <h1>Hola... 😊</h1>

      <p class="mensaje">
        Por si acaso necesitabas una pequeña pausa...
      </p>

      <p class="aqui-esta">
        Aquí está. 🐈
      </p>

      <button class="boton" id="botonAbrir">
        🐾 Abrir carta
      </button>
    </section>

    <section id="carta">
      <img
        src="carta.png"
        alt="Carta especial para ti"
        class="imagen-carta"
      />

      <p class="cierre">
        Espero haber conseguido una. 😊
      </p>

      <div class="gatito-final">🐈</div>
    </section>

  </main>

  <script>
    const botonAbrir = document.getElementById("botonAbrir");
    const pantallaInicial = document.getElementById("pantallaInicial");
    const carta = document.getElementById("carta");

    botonAbrir.addEventListener("click", () => {
      pantallaInicial.classList.add("oculta");

      setTimeout(() => {
        pantallaInicial.style.display = "none";
        carta.style.display = "block";

        requestAnimationFrame(() => {
          carta.classList.add("visible");
        });

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      }, 650);
    });
  </script>
</body>
</html>
