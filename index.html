<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Un pequeño detalle para ti</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,serif;background:linear-gradient(135deg,#f8f1e8,#efe2d1);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;color:#5d493b}
.card{background:#fffcf8;border-radius:28px;box-shadow:0 20px 40px rgba(0,0,0,.12);padding:50px;max-width:760px;width:100%;text-align:center}
h1{font-size:3rem;margin:0 0 20px}
p{font-size:1.35rem;line-height:1.8}
button{margin-top:25px;padding:16px 34px;border-radius:999px;border:1px solid #9c7b62;background:#fffaf4;font-size:1.1rem;cursor:pointer;transition:.25s}
button:hover{transform:translateY(-2px)}
.hidden{display:none}
.fade{animation:fade .7s forwards}
#loader{display:none;text-align:center}
.paws{font-size:2rem;letter-spacing:12px;animation:walk 1.6s linear infinite}
.cat{font-size:3rem;margin-top:15px;animation:bob .6s ease-in-out infinite alternate}
#letter{display:none;opacity:0;transform:scale(.96);transition:all .8s}
#letter.show{opacity:1;transform:scale(1)}
img{max-width:100%;border-radius:20px;box-shadow:0 18px 40px rgba(0,0,0,.15)}
.end{font-size:1.5rem;font-weight:bold;margin-top:35px}
@keyframes fade{to{opacity:0}}
@keyframes walk{0%{transform:translateX(-30px)}50%{transform:translateX(30px)}100%{transform:translateX(-30px)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-8px)}}
</style>
</head>
<body>

<div class="card" id="welcome">
<h1>Hola... 😊</h1>
<p>Por si acaso necesitabas una pequeña pausa...</p>
<p><strong>Aquí está. 🐈</strong></p>
<button id="open">🐾 Abrir carta</button>
</div>

<div class="card" id="loader">
<div class="paws">🐾 🐾 🐾 🐾</div>
<div class="cat">🐈</div>
<p>Un pequeño momento para ti...</p>
</div>

<div class="card" id="letter">
<img src="carta.png" alt="Carta">
<div class="end">
Espero haber conseguido una. 😊
<div style="font-size:2rem;margin-top:8px;">🐈</div>
</div>
</div>

<script>
const w=document.getElementById("welcome");
const l=document.getElementById("loader");
const c=document.getElementById("letter");
document.getElementById("open").onclick=()=>{
 w.classList.add("fade");
 setTimeout(()=>{
   w.style.display="none";
   l.style.display="block";
   setTimeout(()=>{
      l.style.display="none";
      c.style.display="block";
      requestAnimationFrame(()=>c.classList.add("show"));
   },1800);
 },700);
};
</script>

</body>
</html>
